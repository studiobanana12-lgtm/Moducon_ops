*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#192740;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{background:#101e39;color:white;padding:19px 22px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header button{color:white;background:transparent;border:1px solid #7384a1;border-radius:8px;padding:8px}main{max-width:1060px;margin:24px auto;padding:0 17px}.card{background:white;border:1px solid #e0e7f1;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 2px 10px #10204008}.auth{max-width:430px;margin:10vh auto}h1{font-size:23px;margin:0 0 10px}h2{font-size:18px}p{color:#66758e;line-height:1.55}label{display:block;margin-top:15px;font-size:14px;font-weight:600}input{width:100%;border:1px solid #cfd9e8;border-radius:10px;padding:13px;margin-top:7px;font:inherit}button{cursor:pointer;font:inherit}.primary{border:0;background:#285cf1;color:white;padding:13px 17px;border-radius:10px;font-weight:650}.wide{width:100%;margin-top:18px}.muted{font-size:13px;color:#78879c}.error{color:#c53c42!important}.ok{color:#127d55!important}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.nav button{min-width:0;font-size:13px;white-space:normal;line-height:1.3}@media(max-width:360px){.nav{grid-template-columns:repeat(2,minmax(0,1fr))}}.nav button{padding:10px 12px;border:0;border-radius:9px;background:white;white-space:nowrap}.nav .on{background:#285cf1;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.pill{background:#edf3ff;color:#2458c6;border-radius:20px;padding:5px 9px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.item{border-bottom:1px solid #e7ecf5;padding:13px 0}.item:last-child{border-bottom:0}.alert{background:#fff5db;color:#765919;padding:13px;border-radius:12px;margin:15px 0;font-size:13px}@media .hero{padding:24px 23px;border-radius:22px;background:linear-gradient(120deg,#142750,#213c7c 62%,#315ef0);color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 30px #1e3e872b}.hero:after{content:'';position:absolute;width:170px;height:170px;border:1px solid #ffffff2b;border-radius:50%;right:-65px;top:-65px;box-shadow:0 0 0 36px #ffffff08,0 0 0 72px #ffffff07}.hero h1{color:white;position:relative;z-index:1}.hero p{color:#c6d7ff;position:relative;z-index:1;margin:0}.hero .eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#a8c5ff;margin-bottom:12px}

select{width:100%;border:1px solid #cfd9e8;border-radius:10px;padding:13px;margin-top:7px;background:white;font:inherit}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{background:#eef3ff;color:#2458c6;border:1px solid #d9e4fc;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:650}hr{border:0;border-top:1px solid #e9edf5;margin:20px 0}</style><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><header><div><strong>▶ MODUCON OPS</strong><div class="muted">고객별로 안전하게 분리된 콘텐츠 운영</div></div><button id="logout" style="display:none" onclick="logout()">로그아웃</button></header><main id="app"></main><script>
let sb=null,session=null,roles=[],orgs=[],page='home',videos=[],error='',loading=false,recoveryMode=false,schedules=[],channels=[],kakaoUrl='';
const el=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const configured=Boolean(window.MODUCON_SUPABASE_URL&&window.MODUCON_SUPABASE_ANON_KEY);
if('scrollRestoration' in history)history.scrollRestoration='manual';window.addEventListener('pageshow',()=>window.scrollTo(0,0));if(configured&&window.supabase){sb=window.supabase.createClient(window.MODUCON_SUPABASE_URL,window.MODUCON_SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((event)=>{if((event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&location.hash.includes('type=invite')))){recoveryMode=true;passwordForm()}else if(!recoveryMode)setTimeout(refresh,0)});if((location.hash.includes('type=recovery')||location.hash.includes('type=invite'))){recoveryMode=true;passwordForm()}else refresh()}else login();
function login(){document.getElementById('logout').style.display='none';el.innerHTML='<section class="card auth"><h1>모두콘 OPS 로그인</h1><p>모두콘 직원과 고객사가 각자 자신의 계정으로 접속합니다.</p>'+(configured?'':'<div class="alert">현재 Supabase 연결 설정이 필요합니다. 관리자가 프로젝트 URL과 공개 키를 설정해야 로그인할 수 있습니다.</div>')+'<form onsubmit="signIn(event)"><label>이메일<input id="email" type="email" required autocomplete="username" placeholder="name@company.com"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><button class="primary wide" '+(!configured?'disabled':'')+'>로그인</button></form><p class="error" id="err">'+esc(error)+'</p><p><a href="#" onclick="forgotPassword(event)">비밀번호 설정 / 재설정 메일 받기</a></p><p class="muted">고객 계정은 모두콘 관리자가 초대합니다. 공개 회원가입은 제공하지 않습니다.</p></section>'}
async function forgotPassword(e){e.preventDefault();const email=prompt('비밀번호 설정 메일을 받을 이메일을 입력하세요','studiobanana12@gmail.com');if(!email)return;const {error:err}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});alert(err?'메일 발송 실패: '+err.message:'비밀번호 설정 메일을 확인하세요. 메일 속 링크를 눌러 이 사이트로 돌아오면 새 비밀번호를 지정할 수 있습니다.');}
function passwordForm(){document.getElementById('logout').style.display='none';el.innerHTML='<section class="card auth"><h1>새 비밀번호 설정</h1><p>모두콘 OPS 로그인에 사용할 새 비밀번호를 입력하세요.</p><form onsubmit="savePassword(event)"><label>새 비밀번호<input id="newpassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="primary wide">비밀번호 저장</button></form><p class="error" id="pwerr"></p></section>'}
async function savePassword(e){e.preventDefault();const {error:err}=await sb.auth.updateUser({password:document.getElementById('newpassword').value});if(err){document.getElementById('pwerr').textContent=err.message;return}recoveryMode=false;history.replaceState(null,'',location.pathname);alert('비밀번호 설정이 완료되었습니다.');await refresh()}
async function signIn(e){e.preventDefault();if(!sb)return;const {error:err}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(err){error=err.message;login()}}
async function refresh(){if(!sb)return;const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){roles=[];orgs=[];error='';login();return}const [m,o]=await Promise.all([sb.from('memberships').select('organization_id,role').eq('user_id',s.user.id),sb.from('organizations').select('id,name')]);if(m.error||o.error){el.innerHTML='<div class="card"><h1>계정 권한 확인 필요</h1><p>'+esc(m.error?.message||o.error?.message)+'</p><p>관리자에게 소속 회사 및 역할 설정을 요청하세요.</p></div>';return}roles=m.data||[];if(!roles.length){el.innerHTML='<div class="card"><h1>접근 권한 없음</h1><p>이 계정에는 아직 고객사 또는 직원 역할이 부여되지 않았습니다. 모두콘 관리자에게 문의하세요.</p></div>';document.getElementById('logout').style.display='block';return}orgs=o.data||[];const v=await sb.from('videos').select('id,title,status,organization_id,created_at,storage_path,feedback').order('created_at',{ascending:false}).limit(100);if(v.error){el.innerHTML='<div class="card"><h1>영상 목록을 불러올 수 없습니다.</h1><p>'+esc(v.error.message)+'</p></div>';return}videos=v.data||[];const [sc,ch,ka]=await Promise.all([sb.from('publish_schedule').select('id,organization_id,video_id,platform,scheduled_at,status').order('scheduled_at',{ascending:true}).limit(200),sb.from('social_channels').select('organization_id,platform,handle,status'),sb.from('app_settings').select('value').eq('key','kakao_channel_url').maybeSingle()]);schedules=sc.data||[];channels=ch.data||[];kakaoUrl=ka.data?.value||'';render()}
const isAdmin=()=>roles.some(r=>r.role==='admin');const clientOrgs=()=>orgs.filter(o=>o.name!=='모두콘 (내부 운영)');const isStaff=()=>roles.some(r=>r.role==='admin'||r.role==='staff');const myOrg=id=>orgs.find(o=>o.id===id)?.name||'고객사';const menus=()=>isStaff()?[['home','대시보드'],['clients','고객사 관리'],['videos','영상 관리'],['calendar','게시 일정'],['stats','성과 분석'],['talk','카톡 상담']]:[['home','내 대시보드'],['videos','영상 확인'],['calendar','게시 일정'],['stats','성과 확인'],['talk','상담']];
async function createCustomer(e){e.preventDefault();if(!isAdmin())return;const input=document.getElementById('customerName');const name=input?.value.trim();if(!name||name.length<2)return;const btn=document.getElementById('createCustomerButton');btn.disabled=true;const {error:err}=await sb.rpc('create_customer_organization',{customer_name:name});if(err){alert('고객사 등록 실패: '+err.message);btn.disabled=false;return}await refresh();page='clients';render();alert('고객사가 등록되었습니다. 고객 로그인 초대 기능은 다음 단계에서 연결합니다.')}
async function inviteCustomer(e){e.preventDefault();if(!isAdmin())return;const email=document.getElementById('inviteEmail').value.trim(),organization_id=document.getElementById('inviteOrg').value,btn=document.getElementById('inviteButton');btn.disabled=true;try{const {data:{session:ss}}=await sb.auth.getSession();const res=await fetch(window.MODUCON_SUPABASE_URL+'/functions/v1/invite-customer',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ss.access_token,apikey:window.MODUCON_SUPABASE_ANON_KEY},body:JSON.stringify({email,organization_id})});const data=await res.json();if(!res.ok)throw Error(data.error||'초대 실패');alert('고객 초대 메일을 발송했습니다.')}catch(err){alert('초대 실패: '+err.message)}finally{btn.disabled=false}}
async function uploadVideo(e){e.preventDefault();if(!isStaff())return;const org=document.getElementById('videoOrg').value,title=document.getElementById('videoTitle').value.trim(),file=document.getElementById('videoFile').files[0],btn=document.getElementById('uploadButton');if(!file||!org||!title)return;if(file.size>100*1024*1024){alert('100MB 이하 영상만 가능합니다.');return}if(!['video/mp4','video/quicktime','video/webm'].includes(file.type)){alert('MP4, MOV, WebM 파일만 가능합니다.');return}btn.disabled=true;btn.textContent='업로드 중...';const path=org+'/'+crypto.randomUUID()+'.'+(file.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,'');try{const up=await sb.storage.from('client-videos').upload(path,file,{contentType:file.type});if(up.error)throw up.error;const db=await sb.from('videos').insert({organization_id:org,title,status:'review',storage_path:path});if(db.error){await sb.storage.from('client-videos').remove([path]);throw db.error}await refresh();page='videos';render();alert('영상이 등록되었습니다.')}catch(err){alert('업로드 실패: '+err.message)}finally{btn.disabled=false;btn.textContent='영상 업로드'}}
async function openVideo(id){const v=videos.find(x=>x.id===id);if(!v?.storage_path)return;const {data,error:err}=await sb.storage.from('client-videos').createSignedUrl(v.storage_path,120);if(err){alert('영상 열기 실패: '+err.message);return}window.open(data.signedUrl,'_blank','noopener,noreferrer')}
async function reviewVideo(id,status){const feedback=status==='revision'?prompt('수정 요청 내용을 입력하세요'):'';if(feedback===null)return;const {error:err}=await sb.rpc('review_video',{p_video_id:id,p_status:status,p_feedback:feedback||''});if(err){alert('처리 실패: '+err.message);return}await refresh();page='videos';render();alert(status==='approved'?'승인 완료':'수정 요청 저장 완료')}
async function saveSchedule(e){e.preventDefault();if(!isStaff())return;const videoId=document.getElementById('scheduleVideo').value,video=videos.find(v=>v.id===videoId),platform=document.getElementById('schedulePlatform').value,local=document.getElementById('scheduleDate').value;if(!video||!local)return;const at=new Date(local);if(isNaN(at.getTime())||at<=new Date()){alert('미래 날짜와 시간을 선택하세요.');return}const {error:err}=await sb.from('publish_schedule').insert({organization_id:video.organization_id,video_id:video.id,platform,scheduled_at:at.toISOString()});if(err){alert('일정 저장 실패: '+err.message);return}await refresh();page='calendar';render();alert('게시 계획이 저장되었습니다. SNS 자동 게시가 아니라 내부 일정입니다.')}
async function cancelSchedule(id){if(!confirm('이 게시 계획을 취소할까요?'))return;const {error:err}=await sb.from('publish_schedule').update({status:'cancelled'}).eq('id',id);if(err){alert(err.message);return}await refresh();page='calendar';render()}
async function saveKakao(e){e.preventDefault();if(!isAdmin())return;const url=document.getElementById('kakaoInput').value.trim();const {error:err}=await sb.rpc('set_kakao_channel_url',{p_url:url});if(err){alert('저장 실패: '+err.message);return}await refresh();page='talk';render();alert('카카오톡 채널 주소가 저장되었습니다.')}
const fmtDate=s=>new Date(s).toLocaleString('ko-KR',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}function box(s){return '<div class="card">'+s+'</div>'}function render(){document.getElementById('logout').style.display='block';const menu=menus();if(!menu.some(x=>x[0]===page))page='home';const staff=isStaff();let h='<section class="hero"><div class="eyebrow">MODUCON · CONTENT OPERATIONS</div><h1>'+(staff?'모두콘 운영센터':'내 콘텐츠 관리')+'</h1><p>'+(staff?'고객의 콘텐츠, 하나의 흐름으로 관리합니다.':'우리 회사의 콘텐츠 진행 상황을 확인하세요.')+'</p></section><div class="nav">'+menu.map(([id,t])=>'<button class="'+(page===id?'on':'')+'" onclick="go(\''+id+'\')">'+t+'</button>').join('')+'</div>';if(page==='home'){h+='<div class="grid">'+[['고객사',staff?clientOrgs().length:orgs.length],['등록된 영상',videos.length],['승인 대기',videos.filter(v=>v.status==='review').length],['게시 완료',videos.filter(v=>v.status==='published').length]].map(([k,v])=>box('<div class="muted">'+k+'</div><div class="stat">'+v+'</div>')).join('')+'</div>'+box('<h2>최근 영상</h2>'+videoRows())}
if(page==='clients'&&staff)h+=box('<h2>고객사 관리</h2>'+(isAdmin()?'<form onsubmit="createCustomer(event)"><label for="customerName">새 고객사 이름</label><input id="customerName" maxlength="100" minlength="2" placeholder="예: 테스트 고객사" required><button id="createCustomerButton" class="primary wide">고객사 등록</button></form><hr>':'')+'<h2>고객사 목록</h2><p>모두콘 내부 운영 조직은 고객사 수에 포함하지 않습니다.</p>'+clientOrgs().map(o=>'<div class="item"><b>'+esc(o.name)+'</b><div class="muted">고객사 ID: '+esc(o.id)+'</div></div>').join('')+'<p class="muted">'+(clientOrgs().length?'':'아직 등록된 실제 고객사가 없습니다. ')+'고객사 등록 기능은 다음 단계에서 추가합니다.</p>'+(isAdmin()&&clientOrgs().length?'<hr><h2>고객 초대</h2><form onsubmit="inviteCustomer(event)"><label>고객사<select id="inviteOrg" required>'+clientOrgs().map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('')+'</select></label><label>고객 이메일<input id="inviteEmail" type="email" required placeholder="friend@example.com"></label><button id="inviteButton" class="primary wide">초대 메일 발송</button></form>':''));
if(page==='videos')h+=(staff?box('<h2>영상 업로드</h2>'+(clientOrgs().length?'<form onsubmit="uploadVideo(event)"><label>고객사<select id="videoOrg">'+clientOrgs().map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('')+'</select></label><label>영상 제목<input id="videoTitle" required maxlength="150"></label><label>영상 파일 (최대 100MB)<input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm" required></label><button id="uploadButton" class="primary wide">영상 업로드</button></form>':'<p>고객사를 먼저 등록하세요.</p>')):'')+box('<h2>영상 목록</h2>'+videoRows());
if(page==='calendar'){const approved=videos.filter(v=>v.status==='approved');h+=(staff?box('<h2>게시 계획 등록</h2><p>내부 일정 관리 기능입니다. 실제 SNS 자동 게시는 플랫폼 인증 후 연결됩니다.</p>'+(approved.length?'<form onsubmit="saveSchedule(event)"><label>승인된 영상<select id="scheduleVideo">'+approved.map(v=>'<option value="'+esc(v.id)+'">'+esc(v.title)+' · '+esc(myOrg(v.organization_id))+'</option>').join('')+'</select></label><label>플랫폼<select id="schedulePlatform"><option value="youtube">YouTube</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option></select></label><label>게시 예정 일시<input id="scheduleDate" type="datetime-local" required></label><button class="primary wide">게시 계획 저장</button></form>':'<p>게시 계획을 만들려면 먼저 영상을 승인하세요.</p>')):'')+box('<h2>게시 일정</h2>'+(schedules.length?schedules.map(x=>'<div class="item"><b>'+esc(videos.find(v=>v.id===x.video_id)?.title||'영상')+'</b><p>'+esc(x.platform)+' · '+fmtDate(x.scheduled_at)+' · '+esc(x.status)+'</p>'+(staff&&x.status==='planned'?'<div class="actions"><button onclick="cancelSchedule(\''+x.id+'\')">계획 취소</button></div>':'')+'</div>').join(''):'<p>등록된 게시 계획이 없습니다.</p>'))}
if(page==='stats')h+=box('<h2>성과 분석</h2><p>실제 조회수·좋아요·댓글 통계는 각 SNS 계정의 공식 API 인증 이후에만 표시됩니다. 임의의 통계를 만들지 않습니다.</p><h2>플랫폼 연결 상태</h2>'+['youtube','instagram','tiktok'].map(platform=>'<div class="item row"><b>'+platform.toUpperCase()+'</b><span class="pill">'+(channels.some(c=>c.platform===platform&&c.status==='connected')?'연결됨':'공식 계정 인증 필요')+'</span></div>').join(''));
if(page==='talk')h+=box('<h2>카카오톡 상담</h2>'+(kakaoUrl?'<p>등록된 카카오톡 채널로 상담할 수 있습니다.</p><p><a href="'+esc(kakaoUrl)+'" target="_blank" rel="noopener noreferrer">카카오톡 상담 열기</a></p>':'<p>카카오톡 채널 주소가 아직 등록되지 않았습니다.</p>')+(isAdmin()?'<form onsubmit="saveKakao(event)"><label>카카오톡 채널 URL<input id="kakaoInput" type="url" placeholder="https://pf.kakao.com/..." value="'+esc(kakaoUrl)+'"></label><button class="primary wide">상담 채널 저장</button></form>':''));
el.innerHTML=h}
function videoRows(){return videos.length?videos.map(v=>'<div class="item"><div class="row"><div><b>'+esc(v.title)+'</b><div class="muted">'+esc(myOrg(v.organization_id))+'</div></div><span class="pill">'+esc(v.status)+'</span></div>'+(v.feedback?'<p>검토 의견: '+esc(v.feedback)+'</p>':'')+'<div class="actions">'+(v.storage_path?'<button onclick="openVideo(\''+v.id+'\')">영상 보기</button>':'')+(['review','revision','approved'].includes(v.status)?'<button onclick="reviewVideo(\''+v.id+'\',\'approved\')">승인</button><button onclick="reviewVideo(\''+v.id+'\',\'revision\')">수정 요청</button>':'')+'</div></div>').join(''):'<p>아직 등록된 영상이 없습니다.</p>'}
async function logout(){await sb?.auth.signOut();session=null;login()}
</script></body></html>
