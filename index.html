<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODUCON OPS · 로그인</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#192740;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{background:#101e39;color:white;padding:19px 22px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header button{color:white;background:transparent;border:1px solid #7384a1;border-radius:8px;padding:8px}main{max-width:1060px;margin:24px auto;padding:0 17px}.card{background:white;border:1px solid #e0e7f1;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 2px 10px #10204008}.auth{max-width:430px;margin:10vh auto}h1{font-size:23px;margin:0 0 10px}h2{font-size:18px}p{color:#66758e;line-height:1.55}label{display:block;margin-top:15px;font-size:14px;font-weight:600}input{width:100%;border:1px solid #cfd9e8;border-radius:10px;padding:13px;margin-top:7px;font:inherit}button{cursor:pointer;font:inherit}.primary{border:0;background:#285cf1;color:white;padding:13px 17px;border-radius:10px;font-weight:650}.wide{width:100%;margin-top:18px}.muted{font-size:13px;color:#78879c}.error{color:#c53c42!important}.ok{color:#127d55!important}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.nav button{min-width:0;font-size:13px;white-space:normal;line-height:1.3}@media(max-width:360px){.nav{grid-template-columns:repeat(2,minmax(0,1fr))}}.nav button{padding:10px 12px;border:0;border-radius:9px;background:white;white-space:nowrap}.nav .on{background:#285cf1;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.pill{background:#edf3ff;color:#2458c6;border-radius:20px;padding:5px 9px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.item{border-bottom:1px solid #e7ecf5;padding:13px 0}.item:last-child{border-bottom:0}.alert{background:#fff5db;color:#765919;padding:13px;border-radius:12px;margin:15px 0;font-size:13px}@media(min-width:760px){.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}}

:root{color-scheme:light;--ink:#14213b;--sub:#71819b;--blue:#3466f6;--line:#e7edf7}
html{scroll-padding-top:90px}body{background:linear-gradient(165deg,#f6f8fe 0%,#eef3fb 65%,#f8faff 100%);color:var(--ink);min-height:100dvh}
header{position:sticky;top:0;z-index:20;background:rgba(14,26,51,.97);backdrop-filter:blur(18px);padding:15px max(18px,env(safe-area-inset-right)) 15px max(18px,env(safe-area-inset-left));box-shadow:0 10px 28px #0b173124}
header strong{font-size:17px;letter-spacing:.5px}header .muted{font-size:11px;color:#a3b3d2;margin-top:3px}
header button{font-size:12px;padding:9px 11px;border-color:#6d7d9c}
main{max-width:1060px;margin:0 auto;padding:24px 18px calc(36px + env(safe-area-inset-bottom));min-height:calc(100dvh - 75px)}
h1{font-size:clamp(25px,5.5vw,34px);letter-spacing:-1.1px;margin:0 0 6px;font-weight:800}h2{letter-spacing:-.4px;font-size:17px}
p{margin-top:6px;font-size:14px;color:#72809b}
.card{border:1px solid #e5ebf5;border-radius:20px;padding:22px;background:#fff;box-shadow:0 8px 30px #1b37620a}
.nav{gap:9px;margin:19px 0 21px}.nav button{border:1px solid #e5ebf5;box-shadow:0 3px 8px #14213b07;border-radius:12px;min-height:47px;padding:10px 5px;font-size:13px;font-weight:650;color:#53709f;transition:background .2s,transform .2s}.nav button:active{transform:scale(.97)}.nav .on{background:#315df1;border-color:#315df1;box-shadow:0 8px 18px #315df13b;color:white}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}.grid .card{padding:21px 18px;min-height:126px;position:relative;overflow:hidden}.grid .card:before{content:'';position:absolute;right:-25px;top:-25px;width:90px;height:90px;border-radius:50%;background:#edf3ff}.grid .card .muted{font-size:13px;font-weight:600;color:#8390a6}.stat{font-size:34px;letter-spacing:-1px;margin-top:11px;color:#1b2b4b}
.hero{padding:24px 23px;border-radius:22px;background:linear-gradient(120deg,#142750,#213c7c 62%,#315ef0);color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 30px #1e3e872b}.hero:after{content:'';position:absolute;width:170px;height:170px;border:1px solid #ffffff2b;border-radius:50%;right:-65px;top:-65px;box-shadow:0 0 0 36px #ffffff08,0 0 0 72px #ffffff07}.hero h1{color:white;position:relative;z-index:1}.hero p{color:#c6d7ff;position:relative;z-index:1;margin:0}.hero .eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#a8c5ff;margin-bottom:12px}
.item{padding:15px 0}.pill{font-weight:650}.primary{background:#315df1;box-shadow:0 6px 18px #315df130}
@media(max-width:400px){header strong{font-size:15px}header .muted{font-size:10px}.nav button{font-size:12px}.hero{padding:22px 18px}.grid .card{padding:18px 16px}}
</style><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><header><div><strong>▶ MODUCON OPS</strong><div class="muted">고객별로 안전하게 분리된 콘텐츠 운영</div></div><button id="logout" style="display:none" onclick="logout()">로그아웃</button></header><main id="app"></main><script>
let sb=null,session=null,roles=[],orgs=[],page='home',videos=[],error='',loading=false,recoveryMode=false;
const el=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const configured=Boolean(window.MODUCON_SUPABASE_URL&&window.MODUCON_SUPABASE_ANON_KEY);
if('scrollRestoration' in history)history.scrollRestoration='manual';window.addEventListener('pageshow',()=>window.scrollTo(0,0));if(configured&&window.supabase){sb=window.supabase.createClient(window.MODUCON_SUPABASE_URL,window.MODUCON_SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;passwordForm()}else if(!recoveryMode)setTimeout(refresh,0)});if(location.hash.includes('type=recovery')){recoveryMode=true;passwordForm()}else refresh()}else login();
function login(){document.getElementById('logout').style.display='none';el.innerHTML='<section class="card auth"><h1>모두콘 OPS 로그인</h1><p>모두콘 직원과 고객사가 각자 자신의 계정으로 접속합니다.</p>'+(configured?'':'<div class="alert">현재 Supabase 연결 설정이 필요합니다. 관리자가 프로젝트 URL과 공개 키를 설정해야 로그인할 수 있습니다.</div>')+'<form onsubmit="signIn(event)"><label>이메일<input id="email" type="email" required autocomplete="username" placeholder="name@company.com"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><button class="primary wide" '+(!configured?'disabled':'')+'>로그인</button></form><p class="error" id="err">'+esc(error)+'</p><p><a href="#" onclick="forgotPassword(event)">비밀번호 설정 / 재설정 메일 받기</a></p><p class="muted">고객 계정은 모두콘 관리자가 초대합니다. 공개 회원가입은 제공하지 않습니다.</p></section>'}
async function forgotPassword(e){e.preventDefault();const email=prompt('비밀번호 설정 메일을 받을 이메일을 입력하세요','studiobanana12@gmail.com');if(!email)return;const {error:err}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});alert(err?'메일 발송 실패: '+err.message:'비밀번호 설정 메일을 확인하세요. 메일 속 링크를 눌러 이 사이트로 돌아오면 새 비밀번호를 지정할 수 있습니다.');}
function passwordForm(){document.getElementById('logout').style.display='none';el.innerHTML='<section class="card auth"><h1>새 비밀번호 설정</h1><p>모두콘 OPS 로그인에 사용할 새 비밀번호를 입력하세요.</p><form onsubmit="savePassword(event)"><label>새 비밀번호<input id="newpassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="primary wide">비밀번호 저장</button></form><p class="error" id="pwerr"></p></section>'}
async function savePassword(e){e.preventDefault();const {error:err}=await sb.auth.updateUser({password:document.getElementById('newpassword').value});if(err){document.getElementById('pwerr').textContent=err.message;return}recoveryMode=false;history.replaceState(null,'',location.pathname);alert('비밀번호 설정이 완료되었습니다.');await refresh()}
async function signIn(e){e.preventDefault();if(!sb)return;const {error:err}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(err){error=err.message;login()}}
async function refresh(){if(!sb)return;const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){roles=[];orgs=[];error='';login();return}const [m,o]=await Promise.all([sb.from('memberships').select('organization_id,role').eq('user_id',s.user.id),sb.from('organizations').select('id,name')]);if(m.error||o.error){el.innerHTML='<div class="card"><h1>계정 권한 확인 필요</h1><p>'+esc(m.error?.message||o.error?.message)+'</p><p>관리자에게 소속 회사 및 역할 설정을 요청하세요.</p></div>';return}roles=m.data||[];if(!roles.length){el.innerHTML='<div class="card"><h1>접근 권한 없음</h1><p>이 계정에는 아직 고객사 또는 직원 역할이 부여되지 않았습니다. 모두콘 관리자에게 문의하세요.</p></div>';document.getElementById('logout').style.display='block';return}orgs=o.data||[];const v=await sb.from('videos').select('id,title,status,organization_id,created_at').order('created_at',{ascending:false}).limit(100);if(v.error){el.innerHTML='<div class="card"><h1>영상 목록을 불러올 수 없습니다.</h1><p>'+esc(v.error.message)+'</p></div>';return}videos=v.data||[];render()}
const isAdmin=()=>roles.some(r=>r.role==='admin');const clientOrgs=()=>orgs.filter(o=>o.name!=='모두콘 (내부 운영)');const isStaff=()=>roles.some(r=>r.role==='admin'||r.role==='staff');const myOrg=id=>orgs.find(o=>o.id===id)?.name||'고객사';const menus=()=>isStaff()?[['home','대시보드'],['clients','고객사 관리'],['videos','영상 관리'],['calendar','게시 일정'],['stats','성과 분석'],['talk','카톡 상담']]:[['home','내 대시보드'],['videos','영상 확인'],['calendar','게시 일정'],['stats','성과 확인'],['talk','상담']];
async function createCustomer(e){e.preventDefault();if(!isAdmin())return;const input=document.getElementById('customerName');const name=input?.value.trim();if(!name||name.length<2)return;const btn=document.getElementById('createCustomerButton');btn.disabled=true;const {error:err}=await sb.rpc('create_customer_organization',{customer_name:name});if(err){alert('고객사 등록 실패: '+err.message);btn.disabled=false;return}await refresh();page='clients';render();alert('고객사가 등록되었습니다. 고객 로그인 초대 기능은 다음 단계에서 연결합니다.')}function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}function box(s){return '<div class="card">'+s+'</div>'}function render(){document.getElementById('logout').style.display='block';const menu=menus();if(!menu.some(x=>x[0]===page))page='home';const staff=isStaff();let h='<section class="hero"><div class="eyebrow">MODUCON · CONTENT OPERATIONS</div><h1>'+(staff?'모두콘 운영센터':'내 콘텐츠 관리')+'</h1><p>'+(staff?'고객의 콘텐츠, 하나의 흐름으로 관리합니다.':'우리 회사의 콘텐츠 진행 상황을 확인하세요.')+'</p></section><div class="nav">'+menu.map(([id,t])=>'<button class="'+(page===id?'on':'')+'" onclick="go(\''+id+'\')">'+t+'</button>').join('')+'</div>';if(page==='home'){h+='<div class="grid">'+[['고객사',staff?clientOrgs().length:orgs.length],['등록된 영상',videos.length],['승인 대기',videos.filter(v=>v.status==='review').length],['게시 완료',videos.filter(v=>v.status==='published').length]].map(([k,v])=>box('<div class="muted">'+k+'</div><div class="stat">'+v+'</div>')).join('')+'</div>'+box('<h2>최근 영상</h2>'+videoRows())}
if(page==='clients'&&staff)h+=box('<h2>고객사 관리</h2>'+(isAdmin()?'<form onsubmit="createCustomer(event)"><label for="customerName">새 고객사 이름</label><input id="customerName" maxlength="100" minlength="2" placeholder="예: 테스트 고객사" required><button id="createCustomerButton" class="primary wide">고객사 등록</button></form><hr>':'')+'<h2>고객사 목록</h2><p>모두콘 내부 운영 조직은 고객사 수에 포함하지 않습니다.</p>'+clientOrgs().map(o=>'<div class="item"><b>'+esc(o.name)+'</b><div class="muted">고객사 ID: '+esc(o.id)+'</div></div>').join('')+'<p class="muted">'+(clientOrgs().length?'':'아직 등록된 실제 고객사가 없습니다. ')+'고객사 등록 기능은 다음 단계에서 추가합니다.</p>');
if(page==='videos')h+=box('<h2>'+(staff?'고객사 영상':'내 회사 영상')+'</h2>'+videoRows()+'<p class="muted">영상 파일 재생·승인 저장은 다음 개발 단계에서 연결합니다.</p>');
if(page==='calendar')h+=box('<h2>게시 일정</h2><p>유튜브·인스타그램·틱톡 예약 게시 연동 전입니다. 실제 게시 일정은 추후 연결됩니다.</p>');
if(page==='stats')h+=box('<h2>성과 분석</h2><p>각 SNS 계정 인증과 공식 통계 API를 연결한 후 조회수와 성과가 표시됩니다.</p>');
if(page==='talk')h+=box('<h2>카카오톡 상담</h2><p>카카오톡 채널 주소가 등록되면 상담 버튼이 활성화됩니다.</p>');
el.innerHTML=h}
function videoRows(){return videos.length?videos.map(v=>'<div class="item row"><div><b>'+esc(v.title)+'</b><div class="muted">'+esc(myOrg(v.organization_id))+'</div></div><span class="pill">'+esc(v.status)+'</span></div>').join(''):'<p>아직 등록된 영상이 없습니다.</p>'}
async function logout(){await sb?.auth.signOut();session=null;login()}
</script></body></html>
