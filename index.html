<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODUCON OPS · 로그인</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#192740;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{background:#101e39;color:white;padding:19px 22px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header button{color:white;background:transparent;border:1px solid #7384a1;border-radius:8px;padding:8px}main{max-width:1060px;margin:24px auto;padding:0 17px}.card{background:white;border:1px solid #e0e7f1;border-radius:17px;padding:22px;margin-bottom:15px;box-shadow:0 2px 10px #10204008}.auth{max-width:430px;margin:10vh auto}h1{font-size:23px;margin:0 0 10px}h2{font-size:18px}p{color:#66758e;line-height:1.55}label{display:block;margin-top:15px;font-size:14px;font-weight:600}input{width:100%;border:1px solid #cfd9e8;border-radius:10px;padding:13px;margin-top:7px;font:inherit}button{cursor:pointer;font:inherit}.primary{border:0;background:#285cf1;color:white;padding:13px 17px;border-radius:10px;font-weight:650}.wide{width:100%;margin-top:18px}.muted{font-size:13px;color:#78879c}.error{color:#c53c42!important}.ok{color:#127d55!important}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav button{padding:10px 12px;border:0;border-radius:9px;background:white;white-space:nowrap}.nav .on{background:#285cf1;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.pill{background:#edf3ff;color:#2458c6;border-radius:20px;padding:5px 9px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.item{border-bottom:1px solid #e7ecf5;padding:13px 0}.item:last-child{border-bottom:0}.alert{background:#fff5db;color:#765919;padding:13px;border-radius:12px;margin:15px 0;font-size:13px}@media(min-width:760px){.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}}
</style><script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><header><div><strong>▶ MODUCON OPS</strong><div class="muted">고객별로 안전하게 분리된 콘텐츠 운영</div></div><button id="logout" style="display:none" onclick="logout()">로그아웃</button></header><main id="app"></main><script>
let sb=null,session=null,roles=[],orgs=[],page='home',videos=[],error='',loading=false;
const el=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const configured=Boolean(window.MODUCON_SUPABASE_URL&&window.MODUCON_SUPABASE_ANON_KEY);
if(configured&&window.supabase){sb=window.supabase.createClient(window.MODUCON_SUPABASE_URL,window.MODUCON_SUPABASE_ANON_KEY);sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh()}else login();
function login(){document.getElementById('logout').style.display='none';el.innerHTML='<section class="card auth"><h1>모두콘 OPS 로그인</h1><p>모두콘 직원과 고객사가 각자 자신의 계정으로 접속합니다.</p>'+(configured?'':'<div class="alert">현재 Supabase 연결 설정이 필요합니다. 관리자가 프로젝트 URL과 공개 키를 설정해야 로그인할 수 있습니다.</div>')+'<form onsubmit="signIn(event)"><label>이메일<input id="email" type="email" required autocomplete="username" placeholder="name@company.com"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><button class="primary wide" '+(!configured?'disabled':'')+'>로그인</button></form><p class="error" id="err">'+esc(error)+'</p><p class="muted">고객 계정은 모두콘 관리자가 초대합니다. 공개 회원가입은 제공하지 않습니다.</p></section>'}
async function signIn(e){e.preventDefault();if(!sb)return;const {error:err}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(err){error=err.message;login()}}
async function refresh(){if(!sb)return;const {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){roles=[];orgs=[];error='';login();return}const [m,o]=await Promise.all([sb.from('memberships').select('organization_id,role').eq('user_id',s.user.id),sb.from('organizations').select('id,name')]);if(m.error||o.error){el.innerHTML='<div class="card"><h1>계정 권한 확인 필요</h1><p>'+esc(m.error?.message||o.error?.message)+'</p><p>관리자에게 소속 회사 및 역할 설정을 요청하세요.</p></div>';return}roles=m.data||[];if(!roles.length){el.innerHTML='<div class="card"><h1>접근 권한 없음</h1><p>이 계정에는 아직 고객사 또는 직원 역할이 부여되지 않았습니다. 모두콘 관리자에게 문의하세요.</p></div>';document.getElementById('logout').style.display='block';return}orgs=o.data||[];const v=await sb.from('videos').select('id,title,status,organization_id,created_at').order('created_at',{ascending:false}).limit(100);if(v.error){el.innerHTML='<div class="card"><h1>영상 목록을 불러올 수 없습니다.</h1><p>'+esc(v.error.message)+'</p></div>';return}videos=v.data||[];render()}
const isStaff=()=>roles.some(r=>r.role==='admin'||r.role==='staff');const myOrg=id=>orgs.find(o=>o.id===id)?.name||'고객사';const menus=()=>isStaff()?[['home','대시보드'],['clients','고객사 관리'],['videos','영상 관리'],['calendar','게시 일정'],['stats','성과 분석'],['talk','카톡 상담']]:[['home','내 대시보드'],['videos','영상 확인'],['calendar','게시 일정'],['stats','성과 확인'],['talk','상담']];
function go(p){page=p;render()}function box(s){return '<div class="card">'+s+'</div>'}function render(){document.getElementById('logout').style.display='block';const menu=menus();if(!menu.some(x=>x[0]===page))page='home';const staff=isStaff();let h='<h1>'+(staff?'모두콘 운영센터':'내 콘텐츠 관리')+'</h1><p>'+(staff?'전체 고객사 업무를 관리합니다.':'내 회사에 연결된 콘텐츠만 표시됩니다.')+'</p><div class="nav">'+menu.map(([id,t])=>'<button class="'+(page===id?'on':'')+'" onclick="go(\''+id+'\')">'+t+'</button>').join('')+'</div>';if(page==='home'){h+='<div class="grid">'+[['고객사',staff?orgs.length:orgs.length],['등록된 영상',videos.length],['승인 대기',videos.filter(v=>v.status==='review').length],['게시 완료',videos.filter(v=>v.status==='published').length]].map(([k,v])=>box('<div class="muted">'+k+'</div><div class="stat">'+v+'</div>')).join('')+'</div>'+box('<h2>최근 영상</h2>'+videoRows())}
if(page==='clients'&&staff)h+=box('<h2>고객사 목록</h2>'+orgs.map(o=>'<div class="item"><b>'+esc(o.name)+'</b><div class="muted">고객사 ID: '+esc(o.id)+'</div></div>').join('')+'<p class="muted">고객사 생성과 계정 초대는 초기 버전에서 Supabase 관리자가 처리합니다.</p>');
if(page==='videos')h+=box('<h2>'+(staff?'고객사 영상':'내 회사 영상')+'</h2>'+videoRows()+'<p class="muted">영상 파일 재생·승인 저장은 다음 개발 단계에서 연결합니다.</p>');
if(page==='calendar')h+=box('<h2>게시 일정</h2><p>유튜브·인스타그램·틱톡 예약 게시 연동 전입니다. 실제 게시 일정은 추후 연결됩니다.</p>');
if(page==='stats')h+=box('<h2>성과 분석</h2><p>각 SNS 계정 인증과 공식 통계 API를 연결한 후 조회수와 성과가 표시됩니다.</p>');
if(page==='talk')h+=box('<h2>카카오톡 상담</h2><p>카카오톡 채널 주소가 등록되면 상담 버튼이 활성화됩니다.</p>');
el.innerHTML=h}
function videoRows(){return videos.length?videos.map(v=>'<div class="item row"><div><b>'+esc(v.title)+'</b><div class="muted">'+esc(myOrg(v.organization_id))+'</div></div><span class="pill">'+esc(v.status)+'</span></div>').join(''):'<p>아직 등록된 영상이 없습니다.</p>'}
async function logout(){await sb?.auth.signOut();session=null;login()}
</script></body></html>
