<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101e39"><title>MODUCON OPS · MVP</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#18243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#101e39;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}header b{font-size:19px}header small{color:#a9b8d1}nav{display:flex;overflow:auto;gap:7px;padding:12px;background:white;border-bottom:1px solid #e6ebf4}button{cursor:pointer;font:inherit}nav button{border:0;border-radius:9px;background:#eef2f8;padding:10px 13px;white-space:nowrap;color:#40506b}nav button.active,.primary{background:#285cf1!important;color:white!important}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:23px;margin:8px 0 6px}p{color:#697890;margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.card{background:white;border:1px solid #e3e9f3;border-radius:15px;padding:17px;margin-bottom:13px;box-shadow:0 2px 8px #1d315008}.stat{font-size:26px;font-weight:800;margin-top:10px}.muted{color:#6a7891;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{border-radius:30px;padding:5px 9px;background:#eaf0ff;color:#2657db;font-size:12px}button.action{border:1px solid #cdd7e7;background:white;color:#284165;padding:10px 13px;border-radius:9px;margin:4px 5px 4px 0}input,select,textarea{width:100%;border:1px solid #d4deeb;border-radius:10px;padding:11px;font:inherit;margin:7px 0 12px}textarea{min-height:90px}.video{height:180px;border-radius:12px;background:linear-gradient(135deg,#233a66,#6985bd);display:grid;place-items:center;color:white;font-size:42px;margin:12px 0}.notice{background:#fff6dd;padding:13px;border-radius:12px;color:#76591b;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid #dce5f3;background:white;border-radius:9px;padding:9px}.metric{font-size:20px;font-weight:750}.hidden{display:none}footer{text-align:center;color:#8a97aa;font-size:12px;padding:20px}@media(min-width:850px){.split{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}} </style></head><body><header><div><b>▶ MODUCON OPS</b><div><small>콘텐츠 운영을 한곳에서</small></div></div><small>MVP 1.0 · DEMO</small></header><nav id="nav"></nav><main id="main"></main><footer>MODUCON OPS · 화면 체험용 데모 · 실제 SNS 게시 및 상담 연동 없음</footer><script>
const items=[["home","🏠 대시보드"],["clients","👥 고객사"],["videos","🎬 영상 승인"],["calendar","🗓️ 게시 일정"],["stats","📈 성과 분석"],["talk","💬 카톡 상담"]];let page="home",client="바나나",approved=false,posted=false,chat=[];const $=s=>document.querySelector(s);
function go(p){page=p;render()}function card(s){return '<div class="card">'+s+'</div>'}function title(t,d){return '<h1>'+t+'</h1><p>'+d+'</p>'}function render(){ $('#nav').innerHTML=items.map(([id,name])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+name+'</button>').join('');let h='<div class="notice">체험용 가상 데이터입니다. SNS 자동 게시·고객 로그인·카카오톡 실제 연동은 아직 구현되지 않았습니다.</div>';
if(page==="home"){h+=title("오늘의 운영 현황","2인 운영에 필요한 업무만 빠르게 확인하세요.")+'<div class="grid">'+[['고객사','4'],['승인 대기',approved?'0':'1'],['게시 예정',posted?'0':'3'],['카톡 문의','2']].map(x=>card('<div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div>')).join('')+'</div>'+card('<div class="row"><b>바나나 · 신제품 소개 영상</b><span class="pill">'+(approved?'승인 완료':'승인 대기')+'</span></div><p>고객의 영상 확인과 게시 상태를 관리하세요.</p><button class="action primary" onclick="go(\'videos\')">영상 검토하기</button>')+card('<b>오늘의 빠른 작업</b><div class="tabs"><button onclick="go(\'calendar\')">게시 일정 확인</button><button onclick="go(\'talk\')">카톡 상담 확인</button><button onclick="go(\'stats\')">성과 분석 보기</button></div>')}
if(page==="clients"){h+=title("고객사 관리","고객사별 콘텐츠와 SNS 계정을 분리해 관리합니다.")+['바나나','카페모두','그린푸드','웰시스'].map((x,i)=>card('<div class="row"><div><b>'+x+'</b><div class="muted">YouTube · Instagram · TikTok</div></div><span class="pill">데모 고객사</span></div><button class="action" onclick="client=\''+x+'\';go(\'videos\')">영상 보기</button>')).join('')}
if(page==="videos"){h+=title("영상 검토·승인","고객에게 보여줄 영상과 피드백을 관리합니다.")+card('<div class="row"><b>'+client+' · 신제품 홍보 영상</b><span class="pill">'+(approved?'승인 완료':'승인 대기')+'</span></div><div class="video">▶</div><div class="muted">영상 재생 영역 · 실제 파일 미연결</div><p>45초 · 버전 V1 · 세로형 9:16</p><div class="row"><button class="action" onclick="requestEdit()">수정 요청</button><button class="action primary" onclick="approved=true;render();alert(\'데모 승인 상태로 변경했습니다.\')">승인하기</button></div><label class="muted">수정 의견</label><textarea id="feedback" placeholder="예: 첫 3초의 자막을 더 크게 해주세요."></textarea>') }
if(page==="calendar"){h+=title("게시 캘린더","한 번의 승인으로 3대 SNS 게시 일정을 관리합니다.")+card('<b>바나나 · 신제품 홍보 영상</b><p>게시 채널: ▶ YouTube · ◎ Instagram · ♪ TikTok</p><label class="muted">게시 예정 일시</label><input type="datetime-local" id="date"><div class="row"><span class="pill">'+(posted?'데모 예약 완료':'예약 전')+'</span><button class="action primary" onclick="schedule()">게시 예약 시뮬레이션</button></div>')+card('<b>주의</b><p>실제 자동 게시를 위해서는 각 SNS의 공식 API 승인, 고객 계정 연결, 서버 예약 작업이 필요합니다.</p>')}
if(page==="stats"){h+=title("성과 분석","3개 채널의 핵심 지표와 개선 제안을 한곳에서.")+'<div class="grid">'+[['YouTube','24,800'],['Instagram','12,400'],['TikTok','36,200'],['합계','73,400']].map(x=>card('<div class="muted">'+x[0]+' · 조회수</div><div class="metric">'+x[1]+'</div>')).join('')+'</div>'+card('<b>💡 AI 개선 제안 · 예시</b><p>초반 3초에 제품 사용 장면을 먼저 배치하고 제목을 간결하게 바꿔보세요.</p><button class="action" onclick="alert(\'실제 AI 분석은 API 연결 후 제공됩니다.\')">제안 검토</button>')}
if(page==="talk"){h+=title("카카오톡 상담","초기에는 카카오톡 채널 상담으로 연결하고, 고객별 문의를 OPS에서 관리하도록 확장합니다.")+card('<b>💬 카카오톡 상담</b><p>고객은 카카오톡 채널에서 상담합니다. 현재는 채널 주소가 연결되지 않았습니다.</p><button class="action primary" onclick="alert(\'카카오톡 채널 URL을 설정하면 실제 상담 버튼을 연결할 수 있습니다.\')">카카오톡 상담 연결 안내</button>')+card('<b>상담 메모 · 데모</b><input id="memo" placeholder="고객 문의 내용 또는 후속 조치"><button class="action" onclick="addMemo()">메모 추가</button><div id="memos">'+chat.map(x=>'<p>• '+escapeHtml(x)+'</p>').join('')+'</div>')}
$('#main').innerHTML=h}function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function requestEdit(){let t=$('#feedback').value.trim();alert(t?'수정 요청 데모: '+t:'수정 의견을 입력해주세요.')}function schedule(){if(!approved){alert('먼저 영상을 승인하세요.');return}if(!$('#date').value){alert('게시 일시를 선택하세요.');return}posted=true;render();alert('데모 예약 완료! 실제 SNS에는 게시되지 않았습니다.')}function addMemo(){let x=$('#memo').value.trim();if(x){chat.push(x);render()}}render();</script></body></html>
